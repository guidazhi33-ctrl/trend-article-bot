    - title: "🌐 為替相場の読み方を学ぶ書籍(Amazon)"
      url: "https://www.amazon.co.jp/s?k=%E7%82%BA%E6%9B%BF%E7%9B%B8%E5%A0%B4+%E5%88%86%E6%9E%90&i=stripbooks&tag={AMAZON_ID}"
      cta: "👉 ドル円・為替市場のファンダ&テクニカル分析の決定版"

  crypto:
    - title: "📒 暗号資産・ブロックチェーン入門書(Amazon)"
