      cta: "👉 『マスタリング・ビットコイン』など技術的に深く理解したい人向け"

# 挿入ルール
insertion_rules:
  # 記事冒頭(導入の直後)に挿入するアフィリ数
  intro: 1
  # 本文中(セクション境界)に挿入する数
  body: 2
  # 末尾(まとめの直後)に挿入する数
  outro: 1
  # 同一URLの重複挿入禁止
  dedupe: true
  # Amazon 書籍を BODY_2 スロットで優先採用するか
  prefer_amazon_in_body2: true
  # Amazon リンクに付与する開示文(規約・景表法対応)
  amazon_disclosure: "※Amazonのアソシエイトとして、当アカウントは適格販売により収入を得ています。"
