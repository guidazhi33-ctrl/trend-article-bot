# ============================================================
# Amazon 書籍リコメンド(BODY_2 スロット優先で挿入される)
# 各カテゴリの記事に「文脈適合した書籍」を 1 件選んで挿入。
# URL は Amazon.co.jp の検索ページにアフィリ ID を付与する形式で、
# 特定 ASIN ではないので商品廃版でリンク切れにならない堅牢な形。
# ============================================================
amazon_books:
  stock:
    - title: "📚 株式投資の名著・入門書(Amazon)"
      # 検索: "株式投資 名著"
      url: "https://www.amazon.co.jp/s?k=%E6%A0%AA%E5%BC%8F%E6%8A%95%E8%B3%87+%E5%90%8D%E8%91%97&i=stripbooks&tag={AMAZON_ID}"
      cta: "👉 『敗者のゲーム』『株式投資の未来』など投資家必読の書籍をAmazonでチェック"
    - title: "📈 新NISA・米国株の入門書ランキング(Amazon)"
      url: "https://www.amazon.co.jp/s?k=%E6%96%B0NISA+%E7%B1%B3%E5%9B%BD%E6%A0%AA&i=stripbooks&tag={AMAZON_ID}"
      cta: "👉 新NISA時代の戦略・米国株投資の決定版"

  fx:
    - title: "📘 FXトレードの定番書(Amazon)"
      # 検索: "FX 入門 トレード"
      url: "https://www.amazon.co.jp/s?k=FX+%E5%85%A5%E9%96%80+%E3%83%88%E3%83%AC%E3%83%BC%E3%83%89&i=stripbooks&tag={AMAZON_ID}"
