# ============================================================
# キーワード → アフィリエイトリンク マッピング
# 記事内容に「カテゴリのキーワード」が出現したら links のいずれかを
# 適切な見出し直後・本文中・末尾に自動挿入する。
#
# ⚠ note 規約への安全運用方針:
#   - A8.net / もしもアフィリエイト経由の金融案件をメインに据える
#   - Amazon は「**記事内容と高い適合性のある書籍リコメンド**」に限定
#     (家電や雑貨はNG。書籍のみOK = 多くのnoteクリエイターの慣例)
#   - 各記事に 4 リンクまで、コンテキスト外のリンクは挿入しない
#   - CTA テキストには「※Amazonアフィリエイトを含みます」の開示を付与
#
# Amazon の URL 内 `{AMAZON_ID}` は実行時に環境変数 `AMAZON_AFFILIATE_ID`
# に置換される。未設定なら Amazon リンクは無視され A8 にフォールバック。
# ============================================================

